; PlatformIO build config. Arduino IDE users: just open CryptoTicker/CryptoTicker.ino
[platformio]
src_dir = CryptoTicker
default_envs = d1_mini

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; 160 MHz makes the TLS handshake with Binance ~2x faster
board_build.f_cpu = 160000000L
lib_deps =
    bblanchon/ArduinoJson
    esp32async/ESPAsyncTCP
    esp32async/ESPAsyncWebServer
    marcoschwartz/LiquidCrystal_I2C

[env:d1_mini]
board = d1_mini

[env:nodemcuv2]
board = nodemcuv2
